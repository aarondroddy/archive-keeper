[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "archive-keeper"
version = "1.6.8"
description = "Safe, resumable quarantine workflow for rmlint duplicate reports"
requires-python = ">=3.10"
readme = "README.md"
license = {text = "MIT"}
authors = [{name = "Aaron"}]
dependencies = []


[project.scripts]
archive-keeper = "archive_keeper.cli:main"

[tool.setuptools.packages.find]
include = ["archive_keeper*"]
