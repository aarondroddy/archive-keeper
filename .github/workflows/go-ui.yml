name: Go UI

on:
  pull_request:
    paths:
      - "cmd/archive-keeper-ui/**"
      - "archive_keeper/ui_bridge.py"
      - "archive_keeper/cli.py"
      - "archive_keeper/bin/**"
      - "tests/test_ui_bridge.py"
      - "tests/test_archive_keeper.py"
      - "tests/test_ui_pty.py"
      - "go.mod"
      - "go.sum"
      - "pyproject.toml"
      - "setup.py"
      - "install.sh"
      - "scripts/build-combined-package.sh"
      - ".github/workflows/go-ui.yml"
  push:
    branches: ["feature/v2-storage-galaxy"]

permissions:
  contents: read

jobs:
  python-bridge:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Test Python engine and bridge
        run: python -m unittest discover -s tests -v

  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.24.x"
          cache: true
      - name: Resolve modules
        run: go mod download
      - name: Vet
        run: go vet ./...
      - name: Test
        run: go test ./...
      - name: Build Storage Galaxy
        run: |
          mkdir -p archive_keeper/bin
          go build -trimpath -o archive_keeper/bin/archive-keeper-ui ./cmd/archive-keeper-ui
          chmod 755 archive_keeper/bin/archive-keeper-ui
      - name: Build combined Python and Storage Galaxy wheel
        run: |
          python -m pip wheel --no-deps --wheel-dir dist .
          ls dist/*-linux_x86_64.whl
      - name: Verify isolated combined installation
        run: |
          python -m venv /tmp/archive-keeper-install
          /tmp/archive-keeper-install/bin/pip install --no-deps dist/*.whl
          /tmp/archive-keeper-install/bin/archive-keeper --version
          /tmp/archive-keeper-install/bin/archive-keeper ui --health-check

  pty-reliability:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - uses: actions/setup-go@v5
        with:
          go-version: "1.24.x"
          cache: true
      - name: Install tmux
        run: sudo apt-get update && sudo apt-get install -y tmux
      - name: Run isolated PTY reliability suite
        run: python -m unittest tests.test_ui_pty -v
