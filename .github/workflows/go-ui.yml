name: Go UI

on:
  pull_request:
    paths:
      - "cmd/archive-keeper-ui/**"
      - "archive_keeper/ui_bridge.py"
      - "tests/test_ui_bridge.py"
      - "go.mod"
      - "go.sum"
      - ".github/workflows/go-ui.yml"
  push:
    branches: ["feature/v2-storage-galaxy"]

permissions:
  contents: read

jobs:
  python-bridge:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Test read-only bridge
        run: python -m unittest tests.test_ui_bridge -v

  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.24.x"
          cache: true
      - name: Resolve modules
        run: go mod download
      - name: Vet
        run: go vet ./...
      - name: Test
        run: go test ./...
      - name: Build Storage Galaxy
        run: go build -o archive-keeper-ui ./cmd/archive-keeper-ui
